# ax-eval Configuration Example
#
# Copy this file to `ax-eval-config.toml` in your working directory
# to customize tool configurations and test profiles.

fixtures_path = "fixtures"
results_path = "ax-eval-results"

# Tool configurations define known LLM tools and their supported models.
# The `command` field is currently metadata for built-in adapters; adapter
# launch binaries are selected by tool name in the runner.
[tools]

[tools.opencode]
name = "opencode"
command = "opencode"
models = ["gpt-4o", "claude-sonnet"]

[tools.claude-code]
name = "claude-code"
command = "claude"
models = ["claude-sonnet", "claude-haiku"]

[tools.codex]
name = "codex"
command = "codex"
models = ["gpt-5-codex"]

# Profile configurations define test matrices (combinations of tools and models)
[profiles]

[profiles.quick]
name = "quick"
tools = ["opencode"]
models = ["gpt-4o"]

[profiles.standard]
name = "standard"
tools = ["opencode", "claude-code"]
models = ["claude-sonnet"]

[profiles.full]
name = "full"
tools = ["opencode"]
models = ["gpt-4o", "claude-sonnet"]

# Profiles build a Cartesian product of tools × models, and every selected
# model must be supported by every selected tool. Use scenario `tool_matrix`
# for heterogeneous matrices such as opencode/gpt-4o plus codex/gpt-5-codex.
