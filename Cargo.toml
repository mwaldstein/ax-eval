[package]
name = "llm-tool-test"
version = "0.1.0-beta2"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
portable-pty = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
wait-timeout = "0.2"
yaml_serde = "0.10.4"

[dev-dependencies]
tempfile = "3.24.0"
assert_cmd = "2.0"
predicates = "3.0"
