[package]
name = "ax-eval"
version = "0.2.0-beta1"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
tracing = "0.1"
tracing-subscriber = "0.3"
portable-pty = "0.9.0"
sha2 = "0.11.0"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
wait-timeout = "0.2"
yaml_serde = "0.10.4"

[dev-dependencies]
tempfile = "3.24.0"
assert_cmd = "2.0"
predicates = "3.0"
