# Example: Guidance Testing — Rich AGENTS.md
# This scenario tests tool usage with comprehensive guidance.
# The LLM has detailed docs, examples, and error handling.

name: example_guidance_rich
description: |
  Tests notes tool usage with rich AGENTS.md guidance.
  Detailed docs with examples, workflows, and error handling
  should produce better interaction metrics than minimal docs.

tier: 1
tags:
  - examples
  - guidance-test
  - rich-docs

template_folder: notes_guidance_rich

target:
  binary: notes
  command_pattern: "notes\\s+(\\S+)"
  health_check: "./notes help"

task:
  prompt: |
    You need to capture notes about a distributed systems project.
    The project involves:
    - Database migration strategy
    - API design considerations
    - Monitoring and alerting setup
    - Deployment pipeline

    Use the `notes` tool to:
    1. Initialize the notes database
    2. Create at least 4 notes covering the topics above
    3. Tag at least 2 notes with "project"
    4. Link related notes together (e.g., database migration to deployment pipeline)
    5. Search for notes related to "design"
    6. Export the notes as JSON

setup:
  commands:
    - chmod +x notes

evaluation:
  gates:
    - type: file_exists
      path: notes.db
      description: Notes database should exist

    - type: command_succeeds
      command: "./notes export --format json"
      description: Export should succeed

    - type: command_json_path
      command: "./notes export --format json"
      path: "$.notes"
      assertion: "len >= 4"
      description: Should have at least 4 notes

    - type: command_output_contains
      command: "./notes list --tag project"
      substring: "project"
      description: At least 2 notes tagged with project

    - type: file_exists
      path: links.txt
      description: Links file should exist (notes were linked)

    # Note: no_transcript_errors is intentionally omitted for guidance
    # scenarios. Discovery errors are expected and measured via interaction
    # metrics (error rate, retry rate, first-try success).
