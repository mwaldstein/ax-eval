# Live-validation scenario for MCP support (not a shipped example: requires
# npx + network to fetch @modelcontextprotocol/server-everything).
# Read-only server: echo and get-sum have no side effects.

name: test_mcp_everything
description: Validate MCP support against the read-only Everything reference server

tier: 0
tags:
  - mcp-validation

template_folder: test_mcp_everything

target:
  kind: mcp
  name: everything
  transport:
    type: stdio
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-everything"]
  tools: [echo, get-sum]

interaction:
  target_commands: required

task:
  prompt: |
    This workspace's calculation and echo services are provided by the
    "everything" server (see AGENTS.md). Produce a service report named
    results.md recording what the service returns for the sum of 17 and 25,
    and for an echo of the message "mcp validation". The report must
    reflect the service's actual responses, not your own computation.

evaluation:
  gates:
    - type: file_exists
      path: results.md
    - type: file_contains
      path: results.md
      substring: "42"

run:
  timeout_secs: 300
